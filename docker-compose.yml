version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: groqai-postgres
    restart: always
    environment:
      POSTGRES_USER: groqai_user
      POSTGRES_PASSWORD: groqai_password
      POSTGRES_DB: groqai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groqai_user -d groqai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
